[project]
name = "kormat"
version = "0.1.0"
description = "Kormat: evidence-traced, criterion-level clinical-trial eligibility screening (educational prototype)"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
  "torch==2.5.1",
  "transformers==4.46.3",
  "peft==0.13.2",
  "accelerate==1.1.1",
  "datasets==3.1.0",
  "huggingface-hub>=0.26,<0.27",
  "safetensors>=0.4.5",
  "numpy>=1.26,<2.1",
  "pandas>=2.2,<2.3",
  "pyarrow>=17,<18",
  "scikit-learn>=1.5,<1.6",
  "scipy>=1.13,<1.15",
  "matplotlib>=3.9,<3.10",
  "pyyaml>=6.0",
  "pysbd==0.3.4",
  "psutil>=6.0",
  "fastapi==0.115.5",
  "uvicorn==0.32.1",
  "pydantic>=2.9,<2.10",
  "python-multipart==0.0.17",
  "httpx>=0.27,<0.28",
]

[dependency-groups]
dev = ["pytest>=8.3,<8.4"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kormat"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: loads a real Qwen model (run with -m slow)"]
addopts = "-m 'not slow'"
